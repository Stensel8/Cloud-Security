name: OpenTofu

# Week 3, opdracht 3.3: immutable infrastructure. Elke wijziging in opentofu/ (main.tf, bastion.tf - dus
# NIET opentofu/rds-bootstrap/, dat draait los en maar één keer, zie week-1/README.md) rolt een schone
# deployment uit. Op een pull request alleen plan, zodat een foute wijziging opvalt vóór de merge.
# Draait op OpenTofu (de open-source fork van Terraform), niet op HashiCorp Terraform zelf.
on:
  push:
    branches: [uitwerkingen]
    paths: ["opentofu/*.tf"]
  pull_request:
    paths: ["opentofu/*.tf"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opentofu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opentofu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure AWS credentials (Learner Lab)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Learner Lab geeft tijdelijke credentials
          aws-region: us-east-1

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.2"

      - run: tofu init

      - name: OpenTofu plan
        run: tofu plan -input=false

      # Alleen op uitwerkingen daadwerkelijk toepassen, zodat een pull request nooit ongemerkt infrastructuur aanpast.
      - name: OpenTofu apply
        if: github.ref == 'refs/heads/uitwerkingen'
        run: tofu apply -input=false -auto-approve
