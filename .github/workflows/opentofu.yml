name: OpenTofu

# Week 3, opdracht 3.3: immutable infrastructure. Elke wijziging in opentofu/ (main.tf, bastion.tf - dus
# NIET opentofu/rds-bootstrap/, dat draait los en maar één keer, zie week-1/README.md) rolt een schone
# deployment uit. Op een pull request alleen plan, zodat een foute wijziging opvalt vóór de merge.
# Draait op OpenTofu (de open-source fork van Terraform), niet op HashiCorp Terraform zelf.
on:
  push:
    branches: [uitwerkingen]
    paths: ["opentofu/*.tf"]
  pull_request:
    paths: ["opentofu/*.tf"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opentofu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opentofu
    # TF_VAR_* i.p.v. losse -var-vlaggen: OpenTofu pikt deze automatisch op voor elke tofu-aanroep hieronder.
    # Moeten exact overeenkomen met de echte waardes in terraform.tfvars (niet gecommit) - anders probeert
    # een CI-apply de live infrastructuur te "repareren" naar lege/foute waardes. lab_profile staat er bewust
    # niet bij: die heeft nu een default van null (zie variables.tf), zodat de AWS-provider in CI gewoon de
    # credentials uit de stap hieronder gebruikt in plaats van een hier niet-bestaand named profile te zoeken.
    env:
      TF_VAR_sshkey: ${{ secrets.SSHKEY }}
      TF_VAR_my_ip: ${{ secrets.MY_IP }}
      TF_VAR_db_vpc_id: ${{ secrets.DB_VPC_ID }}
      TF_VAR_db_route_table_id: ${{ secrets.DB_ROUTE_TABLE_ID }}
      TF_VAR_rds_endpoint: ${{ secrets.RDS_ENDPOINT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure AWS credentials (Learner Lab)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Learner Lab geeft tijdelijke credentials
          aws-region: us-east-1

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.2"

      # bucket komt uit een secret, niet uit backend.hcl (dat is lokaal en gitignored, zie main.tf) - zonder
      # -backend-config hangt deze stap in CI op een input-prompt die nooit beantwoord wordt (geen tty).
      - name: OpenTofu init
        run: tofu init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: OpenTofu plan
        run: tofu plan -input=false

      # Alleen op uitwerkingen daadwerkelijk toepassen, zodat een pull request nooit ongemerkt infrastructuur aanpast.
      # continue-on-error: de apply raakt hier altijd de bewuste, verwachte iam:CreateRole AccessDenied (een
      # student mag in de Learner Lab geen eigen IAM-rollen aanmaken, zie week-2/README.md 2.1) - dat is geen
      # pipeline-fout, dus laat de job niet rood uitslaan op precies het punt dat de opdracht wil laten zien.
      - name: OpenTofu apply
        if: github.ref == 'refs/heads/uitwerkingen'
        continue-on-error: true
        run: tofu apply -input=false -auto-approve
