version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 20

  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 20

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 20

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 20

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 20

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 20

  - package-ecosystem: "terraform" # GitHub heeft geen apart "opentofu"-ecosysteem; deze waarde werkt ook voor OpenTofu's .tf-bestanden
    directory: "/opentofu"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 20
