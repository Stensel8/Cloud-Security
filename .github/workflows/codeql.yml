# Advanced setup, aangemaakt via Security → Code scanning → CodeQL → Configure.
# Aangepast t.o.v. de GitHub-starter: gepinde action-SHA's (zelfde conventie als
# de rest van .github/workflows/), security-extended query-suite i.p.v. de default
# suite, en een echte Maven-build voor de backend i.p.v. source-only ("none")
# build-mode, zodat Java-analyse ook externe dependencies kan meenemen.
name: "CodeQL"

on:
  push:
    branches: ["uitwerkingen"]
  pull_request:
    branches: ["uitwerkingen"]
  schedule:
    - cron: "32 20 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Setup JDK
        if: matrix.build-mode == 'manual'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Build backend (Java)
        if: matrix.build-mode == 'manual'
        working-directory: backend
        run: ./mvnw -B clean compile -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
